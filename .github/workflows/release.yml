        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: copy target\${{ matrix.target }}\release\vn-browser.exe "${{ matrix.artifact }}"
      - name: Package Unix
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release vn-browser
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VN-Browser-Android.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VN-Browser-Android-APK
          path: VN-Browser-Android.apk
      - name: Upload Android Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VN-Browser-Android.apk
